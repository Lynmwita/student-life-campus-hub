<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Student Life &amp; Campus Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#0B1D33">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0B1D33;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(197, 155, 39, 0.35);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 4px 20px -2px rgba(11, 29, 51, 0.08);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #0B1D33;
      border: 2px solid #C59B27;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #FCD34D;
    }
    .icon-container svg {
      width: 36px;
      height: 36px;
    }
    .university-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #C59B27;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0B1D33;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 28px;
    }
    .pill {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(197, 155, 39, 0.12);
      border: 1px solid rgba(197, 155, 39, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #855e09;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }
    .btn-primary {
      background: #0B1D33;
      color: #FCD34D;
      border: 1px solid #C59B27;
    }
    .btn-primary:hover {
      background: #06101E;
      color: #FFFFFF;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: #0B1D33;
      border: 1px solid #CBD5E1;
    }
    .btn-secondary:hover {
      background: #F1F5F9;
    }
    .footer-note {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="university-label">Campus Hub Offline Mode</div>
    <h1>You&apos;re Currently Offline</h1>
    
    <div class="pill">Cached App Shell Active</div>

    <p>
      It looks like your internet connection is unavailable. Cached timetable data and previously loaded campus bulletins remain accessible offline.
    </p>

    <div class="button-group">
      <button class="btn btn-primary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
      <a href="/" class="btn btn-secondary">
        Return Home
      </a>
    </div>

    <div class="footer-note">
      Summit Metropolitan University • Secure Student Life PWA
    </div>
  </div>
</body>
</html>
