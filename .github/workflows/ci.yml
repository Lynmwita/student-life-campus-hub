name: Continuous Integration

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_NAME: "Student Life & Campus Hub"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "false"
      CRON_SECRET: "ci-testing-cron-secret-2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Production Dependency Security Audit
        run: npm audit --omit=dev

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Verification Suite
        run: npm test

      - name: Run Next.js Production Build (Lockdown Verified)
        run: npm run build
